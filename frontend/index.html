<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Job Search Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f6;
    --bg-2: #f3f1ea;
    --surface: #ffffff;
    --surface-2: #f3f1ea;
    --glass-bg: rgba(255, 255, 255, 0.6);
    --glass-border: rgba(31, 42, 38, 0.08);
    --text: #1f2a26;
    --muted: #5b6b64;
    --border: #e4e1d8;
    --emerald: #0f6b4c;
    --emerald-dark: #0a4a34;
    --emerald-wash: #e7f5ee;
    --gold: #c9a227;
    --gold-wash: #faf3dd;
    --gold-text: #8a6d1a;
    --danger: #b5533f;
    --danger-wash: #f7e9e5;
    --focus: #1c7a56;
    --glow-1: rgba(15, 107, 76, 0.12);
    --glow-2: rgba(201, 162, 39, 0.10);
    --shadow-color: rgba(31, 42, 38, 0.10);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #070b09;
      --bg-2: #0b1310;
      --surface: rgba(255, 255, 255, 0.035);
      --surface-2: rgba(255, 255, 255, 0.02);
      --glass-bg: rgba(20, 26, 23, 0.55);
      --glass-border: rgba(255, 255, 255, 0.09);
      --text: #eef2ef;
      --muted: #93a39b;
      --border: rgba(255, 255, 255, 0.09);
      --emerald: #2bdb9a;
      --emerald-dark: #22c98d;
      --emerald-wash: rgba(43, 219, 154, 0.14);
      --gold: #f0cf5f;
      --gold-wash: rgba(240, 207, 95, 0.12);
      --gold-text: #f0cf5f;
      --danger: #ff8a70;
      --danger-wash: rgba(255, 138, 112, 0.12);
      --focus: #2bdb9a;
      --glow-1: rgba(43, 219, 154, 0.28);
      --glow-2: rgba(240, 207, 95, 0.16);
      --shadow-color: rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #070b09;
    --bg-2: #0b1310;
    --surface: rgba(255, 255, 255, 0.035);
    --surface-2: rgba(255, 255, 255, 0.02);
    --glass-bg: rgba(20, 26, 23, 0.55);
    --glass-border: rgba(255, 255, 255, 0.09);
    --text: #eef2ef;
    --muted: #93a39b;
    --border: rgba(255, 255, 255, 0.09);
    --emerald: #2bdb9a;
    --emerald-dark: #22c98d;
    --emerald-wash: rgba(43, 219, 154, 0.14);
    --gold: #f0cf5f;
    --gold-wash: rgba(240, 207, 95, 0.12);
    --gold-text: #f0cf5f;
    --danger: #ff8a70;
    --danger-wash: rgba(255, 138, 112, 0.12);
    --focus: #2bdb9a;
    --glow-1: rgba(43, 219, 154, 0.28);
    --glow-2: rgba(240, 207, 95, 0.16);
    --shadow-color: rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
  }
  h1, h2, h3 { font-family: 'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }
  .eyebrow {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }
  a { color: var(--emerald-dark); }
  button { font-family: inherit; }
  button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* Ambient animated background - subtle drifting glow, no external assets */
  .aurora {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(ellipse 700px 500px at 12% 8%, var(--glow-1), transparent 60%),
      radial-gradient(ellipse 600px 500px at 88% 18%, var(--glow-2), transparent 60%),
      radial-gradient(ellipse 800px 600px at 50% 100%, var(--glow-1), transparent 55%),
      var(--bg);
    background-size: 180% 180%, 180% 180%, 180% 180%, 100% 100%;
    animation: drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { background-position: 0% 0%, 100% 20%, 50% 100%, 0 0; }
    100% { background-position: 15% 20%, 80% 0%, 65% 85%, 0 0; }
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.1rem 1.75rem;
    border-bottom: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    flex: 0 0 auto;
    position: relative;
    z-index: 2;
  }
  header h1 {
    margin: 0;
    font-size: 1.2rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header h1 .accent {
    background: linear-gradient(120deg, var(--emerald), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .header-right { display: flex; align-items: center; gap: 1rem; }
  .status-pulse { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: var(--muted); }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--emerald);
    box-shadow: 0 0 0 3px var(--emerald-wash), 0 0 12px 2px var(--glow-1);
    animation: pulse-dot 2.4s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }
  .date { font-size: 0.78rem; color: var(--muted); }

  main {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 330px minmax(0, 1fr) 350px;
    gap: 1.1rem;
    padding: 1.1rem;
    position: relative;
    z-index: 1;
  }
  .col {
    display: grid;
    min-height: 0;
    gap: 1.1rem;
  }
  .col-left { grid-template-rows: minmax(0, 1fr) auto; }
  .col-right { grid-template-rows: auto minmax(0, 1fr); }

  .glass {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 8px 30px var(--shadow-color);
    animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .col-left .panel:nth-child(1) { animation-delay: 0.02s; }
  .col-left .panel:nth-child(2) { animation-delay: 0.10s; }
  .col-center .chat-panel { animation-delay: 0.06s; }
  .col-right .panel:nth-child(1) { animation-delay: 0.10s; }
  .col-right .panel:nth-child(2) { animation-delay: 0.16s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding: 1.1rem 1.2rem;
  }
  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.8rem;
    flex: 0 0 auto;
  }
  .panel-head .count { font-size: 0.75rem; color: var(--muted); }
  .panel-body { overflow-y: auto; min-height: 0; flex: 1 1 auto; }

  /* Job queue */
  .job-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 12px;
    padding: 0.75rem 0.85rem;
    margin-bottom: 0.6rem;
    cursor: pointer;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .job-card:hover { border-color: var(--emerald); box-shadow: 0 10px 24px var(--shadow-color); }
  .job-card.selected { border-color: var(--emerald); background: var(--emerald-wash); }
  .job-card.tier-strong { border-left-color: var(--emerald); }
  .job-card.tier-look { border-left-color: var(--gold); }
  .job-card.tier-low { border-left-color: var(--border); }
  .job-card-top { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; }
  .score-chip {
    font-family: ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 0.1rem 0.45rem;
    border-radius: 999px;
    color: var(--emerald-dark);
    background: var(--emerald-wash);
    white-space: nowrap;
  }
  .tier-look .score-chip { color: var(--gold-text); background: var(--gold-wash); }
  .job-card .source-tag { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .job-card h3 { margin: 0 0 0.2rem; font-size: 0.88rem; line-height: 1.3; font-weight: 600; font-family: 'Inter', sans-serif; }
  .job-card .meta { margin: 0; font-size: 0.76rem; color: var(--muted); }
  .status-badge {
    font-size: 0.63rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.08rem 0.4rem;
    border-radius: 999px;
    margin-left: 0.4rem;
  }
  .status-applied { background: var(--emerald-wash); color: var(--emerald-dark); }
  .status-interviewing { background: var(--gold-wash); color: var(--gold-text); }
  .status-rejected { background: var(--danger-wash); color: var(--danger); }

  .empty-state { color: var(--muted); font-size: 0.85rem; padding: 1rem 0; text-align: center; }

  /* Progress panel */
  .progress-panel { flex: 0 0 auto; max-height: 34vh; }
  .funnel { display: flex; flex-direction: column; gap: 0.5rem; }
  .funnel-row { display: flex; align-items: center; gap: 0.6rem; }
  .funnel-label { font-size: 0.74rem; color: var(--muted); width: 84px; flex: 0 0 auto; }
  .funnel-track { flex: 1 1 auto; height: 7px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .funnel-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--emerald-dark), var(--emerald)); transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
  .funnel-fill.gold { background: linear-gradient(90deg, var(--gold-text), var(--gold)); }
  .funnel-fill.danger { background: linear-gradient(90deg, var(--danger), var(--danger)); }
  .funnel-count { font-size: 0.78rem; width: 24px; text-align: right; flex: 0 0 auto; }

  /* Chat column */
  .col-center { display: flex; flex-direction: column; min-height: 0; }
  .chat-panel { padding: 1.1rem 1.3rem; flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  .chat-log { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 0.7rem; padding-bottom: 0.5rem; }
  .msg {
    max-width: 78%;
    padding: 0.6rem 0.85rem;
    border-radius: 14px;
    font-size: 0.9rem;
    line-height: 1.45;
    animation: msg-in 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(6px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg-agent { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg-user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 16px var(--emerald-wash);
  }

  .typing-dots { display: inline-flex; gap: 3px; align-items: center; height: 1em; }
  .typing-dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--muted);
    animation: typing-bounce 1.1s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .download-link {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    margin-top: 0.6rem;
    padding: 0.4rem 0.8rem;
    border-radius: 999px;
    background: linear-gradient(120deg, var(--emerald), var(--emerald-dark));
    color: #fff;
    font-size: 0.8rem;
    font-weight: 600;
    text-decoration: none;
    box-shadow: 0 4px 14px var(--emerald-wash);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .download-link:hover { transform: translateY(-1px); box-shadow: 0 6px 20px var(--emerald-wash); }

  .chat-input-row { display: flex; gap: 0.55rem; margin-top: 0.9rem; flex: 0 0 auto; }
  .chat-input-row input {
    flex: 1 1 auto;
    padding: 0.7rem 0.95rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.9rem;
  }
  .icon-btn, .send-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    position: relative;
  }
  .icon-btn:hover, .send-btn:hover { transform: translateY(-1px); }
  .send-btn {
    width: auto;
    padding: 0 1.15rem;
    background: linear-gradient(120deg, var(--emerald), var(--emerald-dark));
    color: #fff;
    border-color: transparent;
    font-weight: 600;
    font-size: 0.85rem;
    box-shadow: 0 4px 14px var(--emerald-wash);
  }
  .icon-btn.listening {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
  }
  .icon-btn.listening::after {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 999px;
    border: 2px solid var(--danger);
    opacity: 0.6;
    animation: mic-ring 1.3s ease-out infinite;
  }
  @keyframes mic-ring {
    0% { transform: scale(0.9); opacity: 0.6; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .chat-hint { font-size: 0.72rem; color: var(--muted); margin-top: 0.55rem; }

  /* Best match card */
  .best-match-card {
    background: linear-gradient(165deg, var(--emerald-wash), transparent 65%), var(--surface);
    border: 1px solid var(--emerald);
    border-radius: 16px;
    padding: 1rem 1.1rem;
    transform-style: preserve-3d;
    will-change: transform;
    position: relative;
    overflow: hidden;
  }
  .best-match-card::before {
    content: "";
    position: absolute;
    top: -40%; right: -20%;
    width: 60%; height: 140%;
    background: radial-gradient(circle, var(--glow-1), transparent 70%);
    pointer-events: none;
  }
  .best-match-card .eyebrow { color: var(--emerald-dark); position: relative; }
  .best-match-score {
    font-family: ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 2rem;
    font-weight: 700;
    background: linear-gradient(120deg, var(--emerald-dark), var(--emerald));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1;
    position: relative;
  }
  .best-match-card h3 { margin: 0.35rem 0 0.15rem; font-size: 0.98rem; position: relative; }
  .best-match-card .meta { margin: 0 0 0.55rem; font-size: 0.78rem; color: var(--muted); position: relative; }
  .best-match-card .reason { font-size: 0.83rem; margin: 0 0 0.75rem; position: relative; }
  .best-match-actions { display: flex; gap: 0.5rem; position: relative; }
  .pill-btn {
    font-size: 0.76rem;
    font-weight: 600;
    padding: 0.45rem 0.8rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    transition: transform 0.15s ease;
  }
  .pill-btn:hover { transform: translateY(-1px); }
  .pill-btn.primary {
    background: linear-gradient(120deg, var(--emerald), var(--emerald-dark));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 14px var(--emerald-wash);
  }

  /* Applied panel */
  .applied-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.55rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.82rem;
    gap: 0.5rem;
  }
  .applied-row:last-child { border-bottom: none; }
  .applied-row .title { font-weight: 600; }
  .applied-row .company { color: var(--muted); font-size: 0.76rem; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>

<div class="aurora"></div>

<header>
  <h1>Job Search <span class="accent">Console</span></h1>
  <div class="header-right">
    <span class="date mono" id="today-date"></span>
    <span class="status-pulse"><span class="dot"></span>live</span>
  </div>
</header>

<main>
  <section class="col col-left">
    <div class="panel glass">
      <div class="panel-head">
        <span class="eyebrow">Queue</span>
        <span class="count mono" id="queue-count">— jobs</span>
      </div>
      <div class="panel-body" id="job-list">
        <div class="empty-state">Loading…</div>
      </div>
    </div>
    <div class="panel glass progress-panel">
      <div class="panel-head">
        <span class="eyebrow">Progress</span>
        <span class="count mono" id="progress-total">—</span>
      </div>
      <div class="funnel" id="funnel"></div>
    </div>
  </section>

  <section class="col-center">
    <div class="chat-panel glass">
      <div class="panel-head">
        <span class="eyebrow">Chat</span>
        <span class="count" id="chat-hint-count">talk or type</span>
      </div>
      <div class="chat-log" id="chat-log"></div>
      <div class="chat-input-row">
        <button class="icon-btn" id="mic-btn" title="Speak">🎙️</button>
        <input id="chat-input" type="text" placeholder="Ask me anything about your search…" autocomplete="off">
        <button class="send-btn" id="send-btn">Send</button>
      </div>
      <div class="chat-hint">Click the mic to talk — I'll only speak back when you do. Otherwise, just type.</div>
    </div>
  </section>

  <section class="col col-right">
    <div class="panel glass">
      <div class="panel-head">
        <span class="eyebrow">Best match</span>
      </div>
      <div id="best-match-slot"><div class="empty-state">Loading…</div></div>
    </div>
    <div class="panel glass">
      <div class="panel-head">
        <span class="eyebrow">Applied</span>
        <span class="count mono" id="applied-count">—</span>
      </div>
      <div class="panel-body" id="applied-list">
        <div class="empty-state">Nothing applied to yet.</div>
      </div>
    </div>
  </section>
</main>

<script>
const API = "";
let jobs = [];
let selectedJob = null;
let chatHistory = []; // [{role: "user"|"assistant", content: string}]
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const $ = (sel) => document.querySelector(sel);

document.getElementById("today-date").textContent = new Date().toLocaleDateString(undefined, {
  weekday: "long", year: "numeric", month: "long", day: "numeric"
});

function tierClass(score) {
  if (score >= 8) return "tier-strong";
  if (score >= 5) return "tier-look";
  return "tier-low";
}
function tierLabel(score) {
  if (score >= 8) return "Strong fit";
  if (score >= 5) return "Worth a look";
  return "Low fit";
}

async function api(path, opts) {
  const res = await fetch(API + path, opts);
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.detail || res.statusText);
  }
  return res.status === 204 ? null : res.json();
}

function jobKey(j) { return `${j.source}:${j.id}`; }

/* Subtle 3D tilt on hover, skipped entirely if reduced-motion is set */
function attachTilt(el, maxDeg = 6) {
  if (reduceMotion) return;
  el.addEventListener("mousemove", (e) => {
    const rect = el.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width;
    const py = (e.clientY - rect.top) / rect.height;
    const rotateY = (px - 0.5) * maxDeg * 2;
    const rotateX = (0.5 - py) * maxDeg * 2;
    el.style.transform = `perspective(700px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-2px)`;
  });
  el.addEventListener("mouseleave", () => { el.style.transform = ""; });
}

function renderJobList() {
  const list = document.getElementById("job-list");
  document.getElementById("queue-count").textContent = `${jobs.length} jobs`;
  if (!jobs.length) {
    list.innerHTML = '<div class="empty-state">No listings yet. Run main.py to fetch and score some.</div>';
    return;
  }
  list.innerHTML = "";
  jobs.forEach((j, i) => {
    const card = document.createElement("div");
    card.className = `job-card ${tierClass(j.score)}` + (selectedJob === jobKey(j) ? " selected" : "");
    const statusBadge = j.status !== "new"
      ? `<span class="status-badge status-${j.status}">${j.status}</span>` : "";
    card.innerHTML = `
      <div class="job-card-top">
        <span class="score-chip mono">#${i + 1} · ${j.score}/10</span>
        <span class="source-tag">${j.source.replace("_", " ")}</span>
      </div>
      <h3>${escapeHtml(j.title)}${statusBadge}</h3>
      <p class="meta">${escapeHtml(j.company)} — ${escapeHtml(j.location)}</p>
    `;
    card.addEventListener("click", () => {
      selectedJob = jobKey(j);
      renderJobList();
      askAboutJob(i + 1);
    });
    attachTilt(card, 4);
    list.appendChild(card);
  });
}

function escapeHtml(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderBestMatch(job) {
  const slot = document.getElementById("best-match-slot");
  if (!job) {
    slot.innerHTML = '<div class="empty-state">Nothing outstanding right now.</div>';
    return;
  }
  slot.innerHTML = `
    <div class="best-match-card">
      <span class="eyebrow">Top pick</span>
      <div class="best-match-score mono">${job.score}<span style="font-size:1rem;color:var(--muted);-webkit-text-fill-color:var(--muted);">/10</span></div>
      <h3>${escapeHtml(job.title)}</h3>
      <p class="meta">${escapeHtml(job.company)} — ${escapeHtml(job.location)}</p>
      <p class="reason">${escapeHtml(job.reason)}</p>
      <div class="best-match-actions">
        <button class="pill-btn primary" data-action="applied">Mark applied</button>
        <a class="pill-btn" href="${job.url || '#'}" target="_blank" rel="noopener">Open listing</a>
      </div>
    </div>
  `;
  slot.querySelector('[data-action="applied"]').addEventListener("click", () => setStatus(job, "applied"));
  attachTilt(slot.querySelector(".best-match-card"), 3);
}

function renderApplied(list) {
  const el = document.getElementById("applied-list");
  document.getElementById("applied-count").textContent = list.length;
  if (!list.length) {
    el.innerHTML = '<div class="empty-state">Nothing applied to yet.</div>';
    return;
  }
  el.innerHTML = list.map(j => `
    <div class="applied-row">
      <div>
        <div class="title">${escapeHtml(j.title)}</div>
        <div class="company">${escapeHtml(j.company)}</div>
      </div>
      <span class="status-badge status-${j.status}">${j.status}</span>
    </div>
  `).join("");
}

function renderProgress(stats) {
  document.getElementById("progress-total").textContent = `${stats.total_scored} scored`;
  const rows = [
    { label: "New", key: "new", cls: "" },
    { label: "Applied", key: "applied", cls: "" },
    { label: "Interview", key: "interviewing", cls: "gold" },
    { label: "Rejected", key: "rejected", cls: "danger" },
  ];
  const max = Math.max(1, stats.total_scored);
  document.getElementById("funnel").innerHTML = rows.map(r => {
    const count = stats.by_status[r.key] || 0;
    const pct = Math.round((count / max) * 100);
    return `
      <div class="funnel-row">
        <span class="funnel-label">${r.label}</span>
        <span class="funnel-track"><span class="funnel-fill ${r.cls}" style="width:${pct}%"></span></span>
        <span class="funnel-count mono">${count}</span>
      </div>
    `;
  }).join("");
}

async function setStatus(job, status) {
  await api(`/api/jobs/${job.source}/${job.id}/status`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status }),
  });
  await refreshAll();
}

async function refreshAll() {
  const [jobsRes, bestRes, appliedRes, progressRes] = await Promise.all([
    api("/api/jobs"),
    api("/api/best-match"),
    api("/api/applied"),
    api("/api/progress"),
  ]);
  jobs = jobsRes;
  renderJobList();
  renderBestMatch(bestRes);
  renderApplied(appliedRes);
  renderProgress(progressRes);
}

/* Chat */
function appendMessage(role, text) {
  const log = document.getElementById("chat-log");
  const el = document.createElement("div");
  el.className = `msg msg-${role}`;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function appendTyping() {
  const log = document.getElementById("chat-log");
  const el = document.createElement("div");
  el.className = "msg msg-agent";
  el.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function addDownloadLink(el, url) {
  const link = document.createElement("a");
  link.href = url;
  link.download = "";
  link.className = "download-link";
  link.textContent = "⬇ Download tailored CV";
  el.appendChild(link);
  el.parentElement.scrollTop = el.parentElement.scrollHeight;
}

async function sendChat(text, { fromVoice = false } = {}) {
  if (!text.trim()) return;
  appendMessage("user", text);
  document.getElementById("chat-input").value = "";
  const thinking = appendTyping();
  try {
    const res = await api("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: chatHistory }),
    });
    thinking.innerHTML = "";
    thinking.textContent = res.reply;
    if (res.download_url) addDownloadLink(thinking, res.download_url);
    if (fromVoice) speak(res.reply);

    chatHistory.push({ role: "user", content: text });
    chatHistory.push({ role: "assistant", content: res.reply });
    if (chatHistory.length > 24) chatHistory = chatHistory.slice(-24);

    await refreshAll();
  } catch (e) {
    thinking.innerHTML = "";
    thinking.textContent = `Something went wrong: ${e.message}`;
  }
}

function askAboutJob(n) {
  sendChat(`Tell me about job ${n}.`);
}

document.getElementById("send-btn").addEventListener("click", () => sendChat($("#chat-input").value));
document.getElementById("chat-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendChat(e.target.value);
});

/* Voice input: browser-native Web Speech API. Speaking back only happens
   when the message came from voice (mic click), never for typed messages. */
const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById("mic-btn");
let recognizer = null;
let listening = false;

if (!SpeechRecognitionImpl) {
  micBtn.disabled = true;
  micBtn.title = "Voice input isn't supported in this browser - try Safari or Chrome, or just type.";
} else {
  recognizer = new SpeechRecognitionImpl();
  recognizer.lang = "en-US";
  recognizer.interimResults = false;
  recognizer.onresult = (e) => {
    const text = e.results[0][0].transcript;
    sendChat(text, { fromVoice: true });
  };
  recognizer.onend = () => { listening = false; micBtn.classList.remove("listening"); };
  recognizer.onerror = () => { listening = false; micBtn.classList.remove("listening"); };

  micBtn.addEventListener("click", () => {
    if (listening) { recognizer.stop(); return; }
    listening = true;
    micBtn.classList.add("listening");
    recognizer.start();
  });
}

function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  window.speechSynthesis.speak(utter);
}

/* Boot */
appendMessage("agent", "Hey! I'm your job search assistant — ask me anything: what's new, how a specific listing looks, whether you should apply, or just talk through your search with me. Click the mic if you'd rather talk.");
refreshAll().catch((e) => appendMessage("agent", `Couldn't load your data: ${e.message}`));
</script>
</body>
